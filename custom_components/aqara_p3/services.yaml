turn_off_outlet:
  name: Turn off outlet with confirmation
  description: Cut AC mains power. Cutting power during startup or operation may cause damage.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: aqara_p3
    confirm_power_cut:
      name: Confirm power-cut risk
      required: true
      selector:
        boolean:
    confirm_running:
      name: Confirm cutting power when considered running
      description: Required when recorded as on or load power exceeds 100 W.
      default: false
      selector:
        boolean:
turn_on_outlet:
  name: Restore outlet power
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: aqara_p3
play_sound:
  name: Play sound
  description: Play a built-in sound with optional volume, total time limit and repeat count.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: aqara_p3
    tone:
      name: Sound
      description: Uses the selected sound when omitted.
      example: DingDong
      selector:
        select:
          mode: dropdown
          options:
            - DingDong
            - Knock
            - Funny
            - Ring
            - MiMix
            - Enthusiastic
            - GuitarClassic
            - IceWorldPiano
            - LeisureTime
            - Childhood
            - MorningStreamlet
            - MusicBox
            - Orange
            - Thinker
            - PoliceCar_1
            - PoliceCar_2
            - Accident
            - CountDown
            - Ghost
            - Gun
            - Battle
            - AirRaid
            - Dog
    volume:
      name: Volume
      description: Uses the device sound volume when omitted.
      selector:
        number:
          min: 0
          max: 100
          step: 1
    stop_after:
      name: Stop after
      description: Maximum total playback time in seconds. Ends after the requested repetitions when omitted.
      selector:
        number:
          min: 0.1
          max: 86400
          step: 0.1
          mode: box
          unit_of_measurement: s
    repeat:
      name: Playback count
      description: Total plays, including the first. Ends when the count or time limit is reached.
      default: 1
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: box
stop_sound:
  name: Stop sound
  description: Stop the current sound and cancel the remaining repetitions.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: aqara_p3
